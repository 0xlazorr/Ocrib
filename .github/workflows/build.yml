name: Ocrib Agent Cross-Platform Build CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Build Debian Package for Linux
  build-linux:
    name: Build Linux DEB Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libcurl4-openssl-dev dpkg-dev

      - name: Make build script executable
        run: chmod +x build_deb.sh

      - name: Build Debian Package
        run: ./build_deb.sh

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ocrib-agent-linux-deb
          path: ocrib-agent.deb

  # 2. Build DMG Installer for macOS
  build-macos:
    name: Build macOS DMG Package
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Compile macOS Binary
        run: |
          clang -Wall -O2 agent.c -lcurl -o remote_agent

      - name: Create DMG structure
        run: |
          mkdir -p dmg_root
          cp remote_agent dmg_root/
          cp install_mac.sh dmg_root/
          cp com.ocrib.agent.plist dmg_root/
          
      - name: Package DMG Installer
        run: |
          hdiutil create -volname "Ocrib Agent Installer" -srcfolder dmg_root -ov -format UDZO ocrib-agent-mac.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ocrib-agent-mac-dmg
          path: ocrib-agent-mac.dmg

  # 3. Build Windows Executable and Service Installer
  build-windows:
    name: Build Windows Service Installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install static libcurl using vcpkg
        run: |
          vcpkg install curl[ssl]:x64-windows-static

      - name: Compile Windows Service Executable
        run: |
          cl.exe /MT /O2 /D_CRT_SECURE_NO_WARNINGS windows_service.c `
            /I C:\vcpkg\installed\x64-windows-static\include `
            /link /LIBPATH:C:\vcpkg\installed\x64-windows-static\lib `
            libcurl.lib ssleay32.lib libeay32.lib crypt32.lib ws2_32.lib wldap32.lib normaliz.lib advapi32.lib user32.lib `
            /OUT:remote_agent.exe

      - name: Compile NSIS Installer
        run: |
          makensis installer.nsi

      - name: Upload EXE Installer Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ocrib-agent-windows-installer
          path: ocrib-agent-installer.exe

  # 4. Build APK for Android
  build-android:
    name: Build Android APK Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew
        working-directory: ${{ github.workspace }}
        continue-on-error: true # If gradlew wrapper is not yet initialized

      - name: Build Android App (Release APK)
        run: |
          cd android
          # Generate Gradle wrapper if missing, then build
          if [ ! -f gradlew ]; then gradle wrapper; fi
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ocrib-agent-android-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
EOF
